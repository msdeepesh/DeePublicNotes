<!-- Real Gemini Window Container -->
<div id="real-gemini-container">
  <div id="gemini-window-header">
    <span>Gemini Workspace</span>
    <button id="gemini-minimize-btn">&times;</button>
  </div>
  
  <!-- Embedding the official web experience -->
  <iframe 
    src="https://gemini.google.com" 
    title="Gemini Window" 
    id="gemini-iframe">
  </iframe>
</div>

<style>
  #real-gemini-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 400px;
    height: 600px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 9999;
    border: 1px solid #dadce0;
  }

  #gemini-window-header {
    background: #f8f9fa;
    padding: 10px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #dadce0;
    font-family: system-ui, sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: #3c4043;
  }

  #gemini-minimize-btn {
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    color: #5f6368;
  }

  #gemini-iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>

<script>
  // Simple close/hide toggle logic
  document.getElementById('gemini-minimize-btn').addEventListener('click', () => {
    document.getElementById('real-gemini-container').style.display = 'none';
  });
</script>
